<!DOCTYPE html>
<html>
<head>
    <title>SwiftApply - Sign Up</title>
</head>
<body>

    <h1>Create your SwiftApply account</h1>

    <form id="signupForm"onsubmit="event.preventDefault();">

        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label>Mobile:</label>
        <input type="tel" id="mobile" required>
        <br><br>

        <label>Password:</label>
        <input type="password" id="password" required>
        <br><br>

        <button type="submit">Sign Up</button>

    </form>

    <p id="message"></p>

    <script>
        alert("Welcome to the SwiftApply Sign Up page! Please fill in your details to create an account.");

        document.getElementById("signupForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            alert("Your new account has been created successfully! You can now log in using your email and password.");

            const data = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                mobile: document.getElementById("mobile").value,
                password: document.getElementById("password").value
            };

            const response = await fetch("http://127.0.0.1:5000/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("message").textContent = result.message || result.error;
        });
    </script>

</body>
</html>
