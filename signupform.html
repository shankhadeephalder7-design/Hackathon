<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftApply - Sign Up</title>
</head>

<body class="main">

    <h1>Create your SwiftApply account</h1>

    <form id="signupForm">

        <label class="user" for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Contact Number:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label>Select your Preferences:</label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="frontend-developer">
            Frontend Developer
        </label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="backend-developer">
            Backend Developer
        </label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="fullstack-developer">
            Fullstack Developer
        </label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="data-scientist">
            Data Scientist
        </label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="ui-ux-designer">
            UI/UX Designer
        </label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="motion-graphics-designer">
            Motion Graphics Designer
        </label>

        <br><br>

        <label>Your Experience:</label>
        <br>

        <label>
            <input type="radio" name="experience" value="Fresher">
            Student with no experience
        </label>
        <br>

        <label>
            <input type="radio" name="experience" value="1-2 years">
            1 to 2 years
        </label>
        <br>

        <label>
            <input type="radio" name="experience" value="5-6 years">
            Almost 5 to 6 years
        </label>
        <br>

        <label>
            <input type="radio" name="experience" value="6-8 years">
            6 to 8 years
        </label>
        <br>

        <label>
            <input type="radio" name="experience" value="8+ years">
            More than 8 years
        </label>

        <br><br>

        <button type="submit">Sign Up</button>

        <button type="reset">Reset</button>

    </form>

    <p id="message"></p>

    <script>
        alert("Welcome to the SwiftApply Sign Up page! Please fill in your details to create an account.");

        document.getElementById("signupForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const data = {
                name: document.getElementById("username").value,
                email: document.getElementById("email").value,
                mobile: document.getElementById("phone").value,
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("http://127.0.0.1:5000/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById("message").textContent =
                    result.message || result.error;

            } catch (error) {
                document.getElementById("message").textContent =
                    "Unable to connect to the server.";
                console.error(error);
            }
        });
    </script>

</body>
</html>
