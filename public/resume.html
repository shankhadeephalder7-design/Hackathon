<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  .resume-card {
    width: min(600px, 100%);
    background: var(--navy-panel);
    border-radius: var(--radius);
    padding: 48px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    animation: card-in 500ms ease both;
  }
  .dropzone {
    border: 1.5px dashed #223a4c;
    border-radius: 14px;
    padding: 40px 20px;
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease;
    margin: 24px 0;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--teal);
    background: #10243b;
  }
  .status-text {
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 16px;
    min-height: 20px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #223a4c;
    border-top-color: var(--teal);
    border-radius: 50%;
    margin: 20px auto 0;
    animation: spin 800ms linear infinite;
    display: none;
  }
  .spinner.show { display: block; }
</style>
</head>
<body>

<div class="resume-card">
  <div class="brand">SwiftApply</div>
  <h1 style="margin-top:4px;">Upload Your Resume</h1>
  <p style="color:var(--ink-dim); font-size:14px;">PDF or DOCX — we'll find jobs that match you.</p>

  <div class="dropzone" id="dropzone">
    <p id="dropzone-label">Click to choose a file, or drag it here</p>
    <input type="file" id="file-input" accept=".pdf,.docx" style="display:none;" />
  </div>

  <div class="spinner" id="spinner"></div>
  <div class="status-text" id="status-text"></div>
</div>

<div id="toast" class="toast"></div>
<script src="resume.js"></script>
</body>
</html>
